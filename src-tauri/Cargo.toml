[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
reqwest = { version = "0.12", features = ["gzip"] }

# Microsoft Store in-app purchase (durable add-on) - Windows only.
# Pinned to 0.61 to match the windows crate Tauri 2.10 already uses, so the
# HWND from window.hwnd() is the same type IInitializeWithWindow expects.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Services_Store",
  "Foundation",
  "Foundation_Collections",
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_System_Com",
] }
